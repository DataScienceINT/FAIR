---
- name: Configure FAIR hello world page
  hosts: localhost
  become: true
  tasks:
    - name: Create hello world page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "hello world\n"
        owner: root
        group: root
        mode: "0644"

    - name: Configure nginx location for FAIR page with SRAM authentication
      ansible.builtin.copy:
        dest: /etc/nginx/app-location-conf.d/fair.conf
        content: |
          location / {
            error_page 401 = @custom_401;
            auth_request /validate;

            auth_request_set $username $upstream_http_username;
            proxy_set_header REMOTE_USER $username;

            root /var/www/html;
            index index.html;
          }
        owner: root
        group: root
        mode: "0644"

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
